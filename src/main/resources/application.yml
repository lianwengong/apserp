server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: aschain
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=ASChain;encrypt=false;trustServerCertificate=true
    username: ${DB_USER:aschain_dev}
    password: ${DB_PASSWORD:AsChain#2026Dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      pool-name: aschain-pool
  flyway:
    enabled: true
    # 生产/既有库：首次接入时以 V18 为基线，之后只执行 V19+
    baseline-on-migrate: true
    baseline-version: 18
    baseline-description: 既有库手工建库基线
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      # 附件上传：单文件 12MB 上限（业务限制见 app.attachment.max-size-mb）
      max-file-size: 12MB
      max-request-size: 14MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: false   # 一期未使用 Redis，先关闭健康检查
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.aschain: DEBUG
    org.springframework.jdbc.core: INFO

app:
  jwt:
    # 必须 >= 32 字节；生产用环境变量 APP_JWT_SECRET 覆盖
    secret: dev-only-secret-change-me-32bytes-minimum-length
    ttl-minutes: 480
  security:
    # 仅开发环境允许用 X-Tenant-Id 请求头，生产必须关闭
    allow-header-auth: true
  attachment:
    # 附件落盘目录（相对工作目录）；换对象存储时只改 AttachmentService 的 store
    dir: ./data/attachments
    max-size-mb: 10
